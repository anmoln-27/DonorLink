<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Blood Requests</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-danger">

    <div class="container-fluid">

        <span class="navbar-brand mb-0 h1">
            DonorLink Blood Request Portal
        </span>

    </div>

</nav>

<!-- MAIN CONTENT -->

<div class="container mt-5">

    <!-- HERO SECTION -->

    <div class="text-center mb-5">

        <h1 class="display-5 fw-bold text-danger">
            Find Blood Donors Quickly
        </h1>

        <p class="text-muted">
            Search for available blood donors in your city.
        </p>

    </div>

    <!-- REQUEST FORM -->

    <div class="card shadow-sm p-4 mb-4">

        <h2 class="mb-4">
            Request Blood
        </h2>

        <form th:action="@{/requests}"
              method="post"
              th:object="${request}">

            <div class="row g-3">

                <!-- NAME -->

                <div class="col-md-4">

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Patient Name"
                           required>

                </div>

                <!-- BLOOD GROUP -->

                <div class="col-md-3">

                    <select th:field="*{bloodGroup}"
                            class="form-select">

                        <option value="">
                            Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>

                        <option value="B+">B+</option>
                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>

                <!-- CITY -->

                <div class="col-md-3">

                    <input type="text"
                           th:field="*{city}"
                           class="form-control"
                           placeholder="City"
                           required>

                </div>

                <!-- BUTTON -->

                <div class="col-md-2">

                    <button type="submit"
                            class="btn btn-danger w-100">

                        Find

                    </button>

                </div>

            </div>

        </form>

    </div>

    <!-- MATCHED DONORS -->

    <div class="card shadow-sm p-4">

        <h2 class="mb-4">
            Matching Donors
        </h2>

        <table class="table table-striped table-hover">

            <thead class="table-danger">

            <tr>

                <th>Name</th>
                <th>Blood Group</th>
                <th>City</th>
                <th>Status</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="donor : ${matches}">

                <td th:text="${donor.name}"></td>

                <td th:text="${donor.bloodGroup}"></td>

                <td th:text="${donor.city}"></td>

                <td>

                    <span class="badge bg-success"
                          th:if="${donor.availability}">

                        Available

                    </span>

                    <span class="badge bg-secondary"
                          th:unless="${donor.availability}">

                        Unavailable

                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- FOOTER -->

<footer class="text-center mt-5 mb-3 text-muted">

    DonorLink © 2026

</footer>

</body>

</html>
