<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Donor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm p-4">

        <h2 class="mb-4">Edit Donor</h2>

        <form th:action="@{/update}" method="post" th:object="${donor}">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" th:field="*{name}" class="form-control">
            </div>

            <div class="mb-3">
                <label>Blood Group</label>
                <input type="text" th:field="*{bloodGroup}" class="form-control">
            </div>

            <div class="mb-3">
                <label>City</label>
                <input type="text" th:field="*{city}" class="form-control">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{availability}" class="form-check-input">
                <label class="form-check-label">Available</label>
            </div>

            <button class="btn btn-success">Update Donor</button>

        </form>

    </div>

</div>

</body>
</html>
