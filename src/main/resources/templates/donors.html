<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>DonorLink</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-danger">

    <div class="container-fluid">

        <span class="navbar-brand mb-0 h1">
            DonorLink Blood Donation System
        </span>

    </div>

</nav>

<!-- MAIN CONTAINER -->

<div class="container mt-5">

    <!-- HERO SECTION -->

    <div class="text-center mb-5">

        <h1 class="display-5 fw-bold text-danger">
            Save Lives Through Blood Donation
        </h1>

        <p class="text-muted">
            Manage blood donors efficiently and quickly.
        </p>

    </div>

    <!-- DASHBOARD CARDS -->

    <div class="row mb-4">

        <div class="col-md-3">

            <div class="card shadow-sm text-center p-3">

                <h4>Total Donors</h4>

                <h1 th:text="${donors.size()}"></h1>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow-sm text-center p-3">

                <h4>Available Donors</h4>

                <h1 th:text="${availableCount}"></h1>

            </div>

        </div>

    </div>

    <!-- ADD DONOR FORM -->

    <div class="card shadow-sm p-4 mb-4">

        <h2 class="mb-4">Add Donor</h2>

        <form th:action="@{/donors}"
              method="post"
              th:object="${newDonor}">

            <div class="row g-3">

                <!-- NAME -->

                <div class="col-md-3">

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="Enter Name"
                           required>

                </div>

                <!-- BLOOD GROUP -->

                <div class="col-md-2">

                    <select th:field="*{bloodGroup}"
                            class="form-select">

                        <option value="">
                            Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>

                        <option value="B+">B+</option>
                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>

                <!-- CITY -->

                <div class="col-md-3">

                    <input type="text"
                           th:field="*{city}"
                           class="form-control"
                           placeholder="Enter City">

                </div>

                <!-- AVAILABILITY -->

                <div class="col-md-2 d-flex align-items-center">

                    <div class="form-check">

                        <input type="checkbox"
                               th:field="*{availability}"
                               class="form-check-input">

                        <label class="form-check-label ms-2">
                            Available
                        </label>

                    </div>

                </div>

                <!-- BUTTON -->

                <div class="col-md-2">

                    <button type="submit"
                            class="btn btn-danger w-100">

                        Add Donor

                    </button>

                </div>

            </div>

        </form>

    </div>

    <!-- SEARCH -->

    <div class="card shadow-sm p-4 mb-4">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h2>Donors List</h2>

            <form th:action="@{/search}"
                  method="get"
                  class="d-flex gap-2">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search blood group or city">

                <button class="btn btn-dark">
                    Search
                </button>

            </form>

        </div>

        <!-- TABLE -->

        <table class="table table-striped table-hover">

            <thead class="table-danger">

            <tr>

                <th>Name</th>
                <th>Blood Group</th>
                <th>City</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="donor : ${donors}">

                <td th:text="${donor.name}"></td>

                <td th:text="${donor.bloodGroup}"></td>

                <td th:text="${donor.city}"></td>

                <td>

                    <span class="badge bg-success"
                          th:if="${donor.availability}">

                        Available

                    </span>

                    <span class="badge bg-secondary"
                          th:unless="${donor.availability}">

                        Unavailable

                    </span>

                </td>

                <td>

                    <a th:href="@{'/edit/' + ${donor.id}}"
                       class="btn btn-warning btn-sm">

                        Edit

                    </a>

                    <a th:href="@{'/delete/' + ${donor.id}}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete donor?')">

                        Delete

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- FOOTER -->

<footer class="text-center mt-5 mb-3 text-muted">

    DonorLink © 2026

</footer>

</body>

</html>
